[package]
name = "ozone-pdf"
version = "2.1.2"
description = "Ozone PDF: editor de PDF gratis y sin conexión"
authors = ["Nicolás Pacheco (Pache Labs)"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "ozone_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
