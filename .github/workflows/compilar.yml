# Genera los instaladores de Ozone PDF 2 para Windows, macOS y Linux.
# Se ejecuta al subir una etiqueta "v*" (por ejemplo v2.0.0) o a mano desde la pestaña Actions.
# Deja un release en borrador con todos los archivos para revisarlo antes de publicarlo.
name: Compilar instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            args: ""
          # Mac Intel: GitHub suele quedarse sin Mac arm64 libres y la compilación no arranca.
          # Desde Intel se arma igual el instalador universal (Intel + Apple Silicon).
          - plataforma: macos-15-intel
            args: "--target universal-apple-darwin"
          - plataforma: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.plataforma, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Ozone PDF ${{ github.ref_name }}"
          releaseBody: "Instaladores de Ozone PDF 2. Windows: .msi o .exe · macOS: .dmg · Linux: .deb o .AppImage"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
